    <style>
        :root {
            /* DIMENSIONS (Portrait Optimized) */
            --book-w: min(90vw, 460px);
            --book-h: min(120vw, 650px);
            
            /* COLORS */
            --bg-dark: #050505;
            --gold: #d4af37;
            --gold-light: #f9d970;
            --leather: #111;
            --glass: rgba(20, 20, 20, 0.9);
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            margin: 0; height: 100vh; width: 100vw;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            overflow: hidden;
            font-family: 'Lato', sans-serif;
            user-select: none; touch-action: none;
            -webkit-font-smoothing: antialiased;
        }

        /* --- PORTRAIT LOCK OVERLAY --- */
        #orientation-lock {
            display: none; /* Hidden by default */
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            flex-direction: column; align-items: center; justify-content: center;
            color: var(--gold); text-align: center;
        }
        .rotate-icon { font-size: 40px; margin-bottom: 20px; animation: spin 2s infinite ease-in-out; }
        @keyframes spin { 0% {transform: rotate(0deg);} 50% {transform: rotate(-90deg);} 100% {transform: rotate(0deg);} }

        /* Show lock screen only on Landscape Mobile/Tablet */
        @media (orientation: landscape) and (max-height: 600px) {
            #orientation-lock { display: flex; }
            .scene, .top-bar { display: none !important; }
        }

        /* --- UI CONTROLS --- */
        .top-bar {
            position: absolute; top: 0; width: 100%; z-index: 500;
            display: flex; justify-content: center; padding-top: 25px;
            pointer-events: none;
        }
        .controls-pill {
            pointer-events: auto;
            display: flex; align-items: center; gap: 8px;
            background: var(--glass);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 8px 16px; border-radius: 50px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        .nav-btn {
            background: none; border: none; color: var(--gold);
            font-size: 20px; padding: 0 10px; cursor: pointer;
            transition: 0.2s;
        }
        .nav-btn:active { transform: scale(0.8); color: #fff; }
        .nav-btn.disabled { opacity: 0.2; pointer-events: none; }

        .sep { width: 1px; height: 16px; background: rgba(255,255,255,0.15); }

        .q-btn {
            background: transparent; border: none; color: #777;
            font-family: 'Cinzel', serif; font-size: 10px; font-weight: 700;
            padding: 6px 8px; cursor: pointer; border-radius: 4px;
            transition: 0.3s;
        }
        .q-btn.active { color: var(--gold); text-shadow: 0 0 10px rgba(212, 175, 55, 0.4); }
        
        /* New Video Button Hover Effect */
        .q-btn:hover { color: #fff; }

        .toast {
            position: absolute; top: 90px;
            font-size: 10px; font-weight: 700; letter-spacing: 2px;
            color: #fff; background: rgba(212, 175, 55, 0.1);
            padding: 8px 16px; border-radius: 4px; border: 1px solid var(--gold);
            opacity: 0; transition: opacity 0.3s; pointer-events: none;
            text-transform: uppercase; z-index: 300;
        }

        /* --- 3D BOOK STAGE --- */
        .scene {
            width: var(--book-w); height: var(--book-h);
            perspective: 2500px; position: relative;
        }
        .book-container {
            width: 100%; height: 100%;
            transform-style: preserve-3d;
            position: relative;
        }
        .sheet {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            transform-style: preserve-3d;
            transform-origin: left center;
            will-change: transform;
        }
        .face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden;
            background: #fff; border-radius: 2px 6px 6px 2px;
            overflow: hidden;
        }
        /* Fold Shadow */
        .face::after {
            content: ''; position: absolute; top:0; left:0; width:100%; height:100%;
            background: linear-gradient(to right, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.1) 15%, rgba(255,255,255,0.1) 40%, rgba(0,0,0,0.1) 100%);
            opacity: 0; pointer-events: none; transition: opacity 0.1s;
        }
        .face.front { z-index: 2; }
        .face.back {
            z-index: 1; transform: rotateY(180deg);
            background: #f0f0f0;
            box-shadow: inset -5px 0 30px rgba(0,0,0,0.2);
        }

        /* --- ROYAL LEATHER THEME --- */
        .leather-face {
            background-color: var(--leather);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");
            box-shadow: inset 5px 0 30px #000;
            border-left: 5px solid #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .gold-border {
            position: absolute; top: 15px; bottom: 15px; left: 15px; right: 15px;
            border: 2px solid rgba(212, 175, 55, 0.5);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .gold-border::before {
            content: '❖'; color: var(--gold); font-size: 20px; position: absolute; top: -12px; background: #111; padding: 0 10px;
        }
        .gold-border::after {
            content: '❖'; color: var(--gold); font-size: 20px; position: absolute; bottom: -12px; background: #111; padding: 0 10px;
        }

        .title-hero {
            font-family: 'Cinzel', serif; font-size: 13vmin; color: var(--gold);
            margin: 0; line-height: 1;
            text-shadow: 0 5px 20px rgba(0,0,0,0.9);
            background: linear-gradient(to bottom, #fff, var(--gold) 60%, #8a701e);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 3vmin; letter-spacing: 0.5em; text-transform: uppercase;
            color: #888; margin-top: 10px; margin-bottom: 40px;
        }
        .names-list { 
            list-style: none; padding: 0; text-align: center;
            border-top: 1px solid rgba(255,255,255,0.1); border-bottom: 1px solid rgba(255,255,255,0.1);
            width: 70%; padding: 15px 0;
        }
        .names-list li {
            font-family: 'Playfair Display', serif; font-size: 2vmin; color: #888; padding: 5px 0;
        }

        .end-msg { font-family: 'Great Vibes', cursive; font-size: 10vmin; color: var(--gold); margin-bottom: 20px; }
        .copy { font-size: 12px; color: #555; letter-spacing: 2px; margin-top: 30px; }

        /* --- GRID IMAGES --- */
        .page-image { width: 100%; height: 100%; background-size: 100% 100%; position: relative; }
        .grid-overlay {
            position: absolute; display: grid;
            grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(5, 1fr);
            top: 1.3%; bottom: 1.3%; left: 5.8%; right: 5.8%; gap: 0.2%;
        }
        .grid-cell { cursor: zoom-in; -webkit-tap-highlight-color: transparent; }
        .grid-cell:active { background: rgba(255,255,255,0.2); border: 1px solid var(--gold); }
        .pg-num { position: absolute; bottom: 10px; width: 100%; text-align: center; color: #aaa; font-size: 10px; }

        /* --- MODAL --- */
        .modal {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: #000;
            z-index: 5000; align-items: center; justify-content: center;
            perspective: 2500px;
        }
        .modal.active { display: flex; animation: openFade 0.3s ease-out; }
        @keyframes openFade { from {opacity:0; transform: scale(0.95);} to {opacity:1; transform: scale(1);} }

        .modal-viewport {
            position: relative; 
            transform-style: preserve-3d;
            box-shadow: 0 0 100px rgba(0,0,0,0.9);
            will-change: transform;
        }
        
        .zoom-frame { width: 100%; height: 100%; overflow: hidden; position: relative; }
        .zoom-content { 
            width: 100%; height: 100%; 
            transform-origin: 0 0; will-change: transform; 
        }
        .hd-img { position: absolute; top:0; left:0; will-change: transform; backface-visibility: hidden; }

        .modal-ui { position: absolute; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        .mui-top, .mui-bot {
            padding: 20px; display: flex; align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }
        .mui-bot { background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); justify-content: center; gap: 50px; }
        .mui-top { justify-content: space-between; }

        .close-btn {
            pointer-events: auto; width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2); color: white;
            display: flex; align-items: center; justify-content: center; font-size: 24px;
            cursor: pointer;
        }
        .pg-count { color: var(--gold); font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: 2px; }
        .turn-btn {
            pointer-events: auto; width: 50px; height: 50px; border-radius: 50%;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        /* --- VIDEO MODAL STYLES --- */
        .video-box {
            width: min(90vw, 900px);
            aspect-ratio: 16/9;
            background: #000;
            border: 3px solid var(--gold);
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.2);
            position: relative;
            display: flex; align-items: center; justify-content: center;
        }
        .video-content-area {
            width: 101%; height: 115%;
        }
        .video-content-area iframe {
            width: 100%; height: 100%; border: none;
        }
        .close-video-btn {
            position: absolute; top: -50px; right: 0;

            background: rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--gold);
        }

    </style>
</head>

<style>
body{margin:0;background:#000;font-family:Arial}

/* MAIN */

<div id="wrap" onmousemove="showUI()">

<div id="thumb"></div>

</div>

<div class="overlay" id="ui">

  <div class="controls">
    <div class="progress" id="progress">
      <div class="fill" id="fill"></div>
      <div class="dot" id="dot"></div>
    </div>

    <div class="bottom">
      <div><span id="cur">0:00</span> / <span id="dur">0:00</span></div>

      </div>

</div>

<script>
let player,raf,hideTimer;
let firstPlay=true,ready=false,dragging=false,dragTime=0;
let reloadTime=null;

const LABELS={
 tiny:"144p",small:"240p",medium:"360p",
 large:"480p",hd720:"720p",
 hd1080:"1080p",hd1440:"1440p",hd2160:"2160p"
};

let tag=document.createElement("script");
tag.src="https://www.youtube.com/iframe_api";
document.body.appendChild(tag);

function onYouTubeIframeAPIReady(){
  createPlayer(0);
}

function createPlayer(start){
  if(player) player.destroy();
  ready=false;

  black.style.display="block";
  buffering.style.display="block";

  player=new YT.Player("player",{
    videoId:"v3orHkxcA_Q",
    playerVars:{
      autoplay:0,
      mute:1,
      controls:0,
      playsinline:1,
      modestbranding:1
    },
    events:{
      onReady:()=>{
        if(start!==null){
          player.seekTo(start,true);
          player.playVideo();
        }
      },
      onStateChange:onState
    }
  });
}

function onState(e){
  if(e.data===YT.PlayerState.BUFFERING){
    buffering.style.display="block";
  }

  if(e.data===YT.PlayerState.PLAYING){
    buffering.style.display="none";
    black.style.display="none";
 
    ready=true;
    player.unMute();
    playBtn.textContent="❚❚";
    loop();
    autoHide();
  }

  if(e.data===YT.PlayerState.PAUSED){
    playBtn.textContent="▶";
    showUI();
  }
}

function toggle(){
  if(firstPlay){
    firstPlay=false;
    playBtn.textContent="❚❚";
    buffering.style.display="block";
    player.playVideo();
    return;
  }

  player.getPlayerState()===1
    ?player.pauseVideo()
    :player.playVideo();
}

/* SEEK (FIXED) */
function loop(){
  cancelAnimationFrame(raf);
  const run=()=>{
    if(!ready) return;

    let d = player.getDuration();
    let c = dragging ? dragTime : player.getCurrentTime();

    /* ✅ HIDE THUMB ONLY WHEN VIDEO ACTUALLY PLAYS */
    if(c > 0.05 && !thumb.classList.contains("hide")){
      thumb.classList.add("hide");
    }

    let p = (c/d)*100;
    fill.style.width = p + "%";
    dot.style.left = p + "%";
    cur.textContent = format(c);
    dur.textContent = format(d);

    raf = requestAnimationFrame(run);
  };
  run();
}

function seekFromEvent(e){
  let r=progress.getBoundingClientRect();
  let x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  let pct=Math.min(Math.max(x/r.width,0),1);
  return pct*player.getDuration();
}

function startDrag(e){
  dragging=true;
  dragTime=seekFromEvent(e);
}
function dragMove(e){
  if(!dragging)return;
  dragTime=seekFromEvent(e);
}
function endDrag(){
  if(!dragging)return;
  dragging=false;
  player.seekTo(dragTime,true);
}

progress.addEventListener("mousedown",startDrag);
dot.addEventListener("mousedown",startDrag);
document.addEventListener("mousemove",dragMove);
document.addEventListener("mouseup",endDrag);

progress.addEventListener("touchstart",startDrag,{passive:true});
document.addEventListener("touchmove",dragMove,{passive:true});
document.addEventListener("touchend",endDrag);

/* UI */
function autoHide(){
  clearTimeout(hideTimer);
  hideTimer=setTimeout(()=>ui.classList.add("hide"),2000);
}
function showUI(){ui.classList.remove("hide");autoHide()}

/* SETTINGS */
function toggleSettings(){
  if(!settings.children.length){
    addQ("Auto","auto");
    player.getAvailableQualityLevels().forEach(q=>{
      if(LABELS[q]) addQ(LABELS[q],q);
    });
  }
  settings.style.display=settings.style.display==="block"?"none":"block";
}

function addQ(label,val){
  let b=document.createElement("button");
  b.textContent=label;
  b.onclick=()=>{
    reloadTime=player.getCurrentTime();
    settings.style.display="none";
    createPlayer(reloadTime);
  };
  settings.appendChild(b);
}

/* FULLSCREEN */
async function toggleFS(){
  if(!document.fullscreenElement){
    try{ await screen.orientation.lock("landscape"); }catch(e){}
    await wrap.requestFullscreen();
    try{ screen.orientation.lock("landscape"); }catch(e){}
  }else{
    document.exitFullscreen();
        try{ await screen.orientation.unlock("portrait"); }catch(e){}
    await wrap.requestFullscreen();
    try{ screen.orientation.unlock("portrait"); }catch(e){}
//screen.orientation.unlock?.();
  }
}

function format(t){
  let m=Math.floor(t/60),s=Math.floor(t%60);
  return m+":"+(s<10?"0":"")+s;
}
</script>

        const pageData = [
            { low: "https://images.weserv.nl/?url=https://ayush8481-dev.github.io/S/Sarnath01.pdf&w=2500&output=jpg&q=60", medium: "https://images.weserv.nl/?url=https://ayush8481-dev.github.io/S/Sarnath01.pdf&w=3500&output=jpg&q=80", high: "https://images.weserv.nl/?url=https://ayush8481-dev.github.io/S/Sarnath01.pdf&w=4000&output=jpg&q=90" },
            { low: "https://images.weserv.nl/?url=https://ayush8481-dev.github.io/S/Sarnath02.pdf&w=2500&output=jpg&q=60", medium: "https://images.weserv.nl/?url=https://ayush8481-dev.github.io/S/Sarnath02.pdf&w=3500&output=jpg&q=80", high: "https://images.weserv.nl/?url=https://ayush8481-dev.github.io/S/Sarnath02.pdf&w=4000&output=jpg&q=90" },
            { low: "https://images.weserv.nl/?url=https://ayush8481-dev.github.io/S/Sarnath03.pdf&w=2500&output=jpg&q=60", medium: "https://images.weserv.nl/?url=https://ayush8481-dev.github.io/S/Sarnath03.pdf&w=3500&output=jpg&q=80", high: "https://images.weserv.nl/?url=https://ayush8481-dev.github.io/S/Sarnath03.pdf&w=4000&output=jpg&q=90" },
            { low: "https://images.weserv.nl/?url=https://ayush8481-dev.github.io/S/Sarnath04.pdf&w=2500&output=jpg&q=60", medium: "https://images.weserv.nl/?url=https://ayush8481-dev.github.io/S/Sarnath04.pdf&w=3500&output=jpg&q=80", high: "https://images.weserv.nl/?url=https://ayush8481-dev.github.io/S/Sarnath04.pdf&w=4000&output=jpg&q=90" },
            { low: "https://images.weserv.nl/?url=https://ayush8481-dev.github.io/S/Sarnath05.pdf&w=2500&output=jpg&q=60", medium: "https://images.weserv.nl/?url=https://ayush8481-dev.github.io/S/Sarnath05.pdf&w=3500&output=jpg&q=80", high: "https://images.weserv.nl/?url=https://ayush8481-dev.github.io/S/Sarnath05.pdf&w=4000&output=jpg&q=90" },
            { low: "https://images.weserv.nl/?url=https://ayush8481-dev.github.io/S/Sarnath06.pdf&w=2500&output=jpg&q=60", medium: "https://images.weserv.nl/?url=https://ayush8481-dev.github.io/S/Sarnath06.pdf&w=3500&output=jpg&q=80", high: "https://images.weserv.nl/?url=https://ayush8481-dev.github.io/S/Sarnath06.pdf&w=4000&output=jpg&q=90" }
        ];

        const ROWS = 5, COLS = 4;
        const MARGIN_X = 0.058, MARGIN_Y = 0.013, GAP = 0.002;
        const REF_W = 360, REF_H = 520;

        let quality = 'low';
        let albumSheets = [];
        let currPage = 0; 
        let isAnimating = false; // NEW: Lock to prevent double-click glitches
        
        let miniSheetsMap = {};
        let currMiniPage = 0;
        let activeData = null;

        const albumBook = document.getElementById('albumBook');
        const modal = document.getElementById('modal');
        const miniBook = document.getElementById('miniBook');

        /* ADDED VIDEO MODAL VAR */
        const videoModal = document.getElementById('videoModal');

        function init() {
            buildAlbum();
            updateStack(albumBook, albumSheets, currPage, false);
            setupInput(albumBook, 'album');
            setupInput(modal, 'modal');
        }

        /* --- QUALITY --- */
        function setQ(q, btn) {
            if(quality === q) return;
            quality = q;
            document.querySelectorAll('.q-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            // Refresh
            document.querySelectorAll('.page-image').forEach(div => {
                const idx = div.getAttribute('data-idx');
                if(idx && pageData[idx]) div.style.backgroundImage = `url(${getUrl(pageData[idx])})`;
            });
            if(modal.classList.contains('active')) renderMiniFrame();

            toast("Quality Updated", false);
        }

        function toast(msg, err) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.style.borderColor = err?'red':null;
            t.style.opacity = 1; setTimeout(()=>t.style.opacity=0, 1500);
        }
        function getUrl(d) {
            if(!d) return "";
            if(quality==='high') return d.high || d.medium || d.low;
            if(quality==='medium') return d.medium || d.low;
            return d.low;
        }

        /* --- VIDEO FUNCTIONS --- */
        function openVideoModal() {
            videoModal.classList.add('active');
        }

        function closeVideoModal() {
            videoModal.classList.remove('active');
            // Optional: If you want video to stop playing when closed, you might need to reload the iframe content
            // or paste specific code here depending on what you paste in the HTML area.
            // For simple HTML preservation, we just hide it.
        }

        /* --- ALBUM BUILDER --- */
        function buildAlbum() {
            albumSheets = [];
            // Cover (Index 0)
            albumSheets.push(makeSheet('cover'));
            // Pages
            pageData.forEach((d, i) => albumSheets.push(makeSheet('page', d, i)));
            // End
            albumSheets.push(makeSheet('end'));

            albumSheets.forEach(s => albumBook.appendChild(s));
        }

        function makeSheet(type, data, i) {
            const s = document.createElement('div'); s.className = 'sheet';
            const f = document.createElement('div'); f.className = 'face front';
            const b = document.createElement('div'); b.className = 'face back';

            if(type==='cover') {
                f.className += ' leather-face';
                f.innerHTML = `<div class="gold-border"><h1 class="title-hero">SARNATH</h1><div class="subtitle">Digital Gallery</div><ul class="names-list"><li>Shiv Prasad Yadav</li><li>Suman Yadav</li><li>Ayush Kumar Yadav</li><li>Ayushi Yadav</li></ul></div>`;
                b.style.background = '#f8f8f8';
                b.style.borderLeft = '1px solid #ddd';
            } else if (type==='end') {
                f.className += ' leather-face';
                f.innerHTML = `<div class="gold-border"><div class="end-msg">Thank You</div><div class="copy">&copy; 2026 Ayush@8481</div></div>`;
                b.className += ' leather-face';
                b.innerHTML = `<div class="gold-border" style="opacity:0.3; transform:scale(0.8)"></div>`;
            } else {
                const img = document.createElement('div'); img.className='page-image';
                img.setAttribute('data-idx', i);
                img.style.backgroundImage = `url(${getUrl(data)})`;
                
                const grid = document.createElement('div'); grid.className='grid-overlay';
                for(let k=0; k<ROWS*COLS; k++) {
                    const c = document.createElement('div'); c.className='grid-cell';
                    c.onclick = (e) => { e.stopPropagation(); openModal(data, k); };
                    grid.appendChild(c);
                }
                img.appendChild(grid); f.appendChild(img);
                b.innerHTML = `<div class="pg-num">${i+1}</div>`;
            }
            s.append(f, b);
            return s;
        }

        /* --- STACKING (Main & Mini) --- */
        function updateStack(container, sheets, activeIdx, isMini) {
            Array.from(isMini ? container.children : sheets).forEach((s, i) => {
                const shadow = s.querySelector('.face.front::after');
                
                if(i < activeIdx) {
                    s.style.transform = 'rotateY(-180deg)';
                    s.style.zIndex = i;
                    if(shadow) shadow.style.opacity = 0.5; // Shadow on back of left pages
                } else if (i === activeIdx) {
                    s.style.transform = 'rotateY(0deg)';
                    s.style.zIndex = 1000;
                    if(shadow) shadow.style.opacity = 0;
                } else {
                    s.style.transform = 'rotateY(0deg)';
                    s.style.zIndex = 1000 - i;
                    if(shadow) shadow.style.opacity = 0;
                }
            });

            if(!isMini) {
                document.getElementById('btnPrev').classList.toggle('disabled', activeIdx===0);
                // Fix: Corrected logic for Next button disable state
                document.getElementById('btnNext').classList.toggle('disabled', activeIdx >= sheets.length - 1);
            }
        }

        /* --- MODAL LOGIC --- */
        function openModal(data, idx) {
            activeData = data; currMiniPage = idx;
            modal.classList.add('active');
            renderMiniFrame();
            zState = { scale:1, tx:0, ty:0 };
        }
        function closeModal() { modal.classList.remove('active'); miniBook.innerHTML=''; }

        function renderMiniFrame() {
            miniBook.innerHTML = '';
            miniSheetsMap = {};
            const layout = calcLayout();
            miniBook.style.width = layout.fw + 'px';
            miniBook.style.height = layout.fh + 'px';
            const total = ROWS*COLS;
            
            [-1, 0, 1].forEach(off => {
                const i = currMiniPage + off;
                if(i >= 0 && i < total) {
                    const s = makeMiniSheet(i, layout.imgW, layout.imgH);
                    miniBook.appendChild(s);
                    miniSheetsMap[i] = s;
                }
            });
            Object.keys(miniSheetsMap).forEach(k => {
                const idx = parseInt(k);
                const s = miniSheetsMap[idx];
                if(idx < currMiniPage) {
                    s.style.transform = 'rotateY(-180deg)'; s.style.zIndex = 1;
                } else if(idx === currMiniPage) {
                    s.style.transform = 'rotateY(0deg)'; s.style.zIndex = 100;
                } else {
                    s.style.transform = 'rotateY(0deg)'; s.style.zIndex = 10;
                }
            });
            document.getElementById('imgCount').innerText = `${currMiniPage+1}/20`;
        }

        function makeMiniSheet(i, w, h) {
            const s = document.createElement('div'); s.className = 'sheet';
            const f = document.createElement('div'); f.className = 'face front';
            
            const zf = document.createElement('div'); zf.className='zoom-frame';
            const zc = document.createElement('div'); zc.className='zoom-content';
            if(i === currMiniPage) zc.id = 'activeZoom'; 

            const img = document.createElement('img'); img.className='hd-img';
            img.style.width=w+'px'; img.style.height=h+'px';
            const pos = getPos(i, w, h);
            img.style.transform = `translate(${pos.x}px, ${pos.y}px)`;
            img.src = getUrl(activeData);

            zc.appendChild(img); zf.appendChild(zc); f.appendChild(zf);
            const b = document.createElement('div'); b.className='face back'; 
            b.style.background='#111'; b.style.color='#333'; b.style.display='flex'; 
            b.style.alignItems='center'; b.style.justifyContent='center'; b.innerText=i+1;
            
            s.append(f, b);
            return s;
        }

        /* --- TOUCH ENGINE --- */
        let touchState = { mode: null, sx: 0, sy: 0, target: null, dir: 0 };
        let zState = { scale: 1, tx: 0, ty: 0 };
        let pinchStart = { dist: 0, cx: 0, cy: 0, startScale: 1, startTx: 0, startTy: 0 };

        function setupInput(el, scope) {
            el.addEventListener('touchstart', e => handleStart(e, scope), {passive:false});
            el.addEventListener('touchmove', e => handleMove(e, scope), {passive:false});
            el.addEventListener('touchend', e => handleEnd(e, scope), {passive:false});
        }

        function handleStart(e, scope) {
            if(isAnimating) return; // Block touch if animating

            if(e.touches.length === 1) {
                if(zState.scale > 1.05 && scope === 'modal') {
                    touchState.mode = 'pan';
                    touchState.sx = e.touches[0].clientX;
                    touchState.sy = e.touches[0].clientY;
                    pinchStart.startTx = zState.tx;
                    pinchStart.startTy = zState.ty;
                } else {
                    touchState.mode = 'turn';
                    touchState.sx = e.touches[0].clientX;
                    touchState.target = null;
                }
            } else if (e.touches.length === 2 && scope === 'modal') {
                touchState.mode = 'zoom';
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                pinchStart.dist = Math.hypot(dx, dy);
                pinchStart.startScale = zState.scale;
                pinchStart.cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                pinchStart.cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                pinchStart.startTx = zState.tx;
                pinchStart.startTy = zState.ty;
            }
        }

        function handleMove(e, scope) {
            e.preventDefault();
            
            if(touchState.mode === 'turn') {
                const dx = e.touches[0].clientX - touchState.sx;
                
                if(!touchState.target) {
                    if (dx < 0) { // Drag Left -> Next
                        if (scope === 'album' && currPage < albumSheets.length - 1) { // Fix: Allow drag up to length
                             touchState.target = albumSheets[currPage];
                             touchState.dir = 1; 
                        } else if (scope === 'modal') {
                             touchState.target = miniSheetsMap[currMiniPage];
                             touchState.dir = 1;
                        }
                    } else if (dx > 0) { // Drag Right -> Prev
                        if (scope === 'album' && currPage > 0) {
                            touchState.target = albumSheets[currPage - 1];
                            touchState.dir = -1;
                        } else if (scope === 'modal') {
                            touchState.target = miniSheetsMap[currMiniPage - 1];
                            touchState.dir = -1;
                        }
                    }
                    if(touchState.target) {
                        touchState.target.style.transition = 'none';
                        touchState.target.style.zIndex = 2000; 
                    }
                }

                if(touchState.target) {
                    let p = dx / 300; 
                    let deg = (touchState.dir === 1) ? Math.max(-180, Math.min(0, p * 180)) : Math.max(-180, Math.min(0, -180 + (p * 180)));
                    touchState.target.style.transform = `rotateY(${deg}deg)`;
                    const shadow = touchState.target.querySelector('.face.front::after');
                    if(shadow) shadow.style.opacity = (Math.abs(deg) / 180) * 0.5;
                }

            } else if (touchState.mode === 'zoom') {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const dist = Math.hypot(dx, dy);
                const scaleFactor = dist / pinchStart.dist;
                
                let newScale = Math.max(1, Math.min(4, pinchStart.startScale * scaleFactor));
                const ds = newScale / pinchStart.startScale;
                const tx = pinchStart.cx - (pinchStart.cx - pinchStart.startTx) * ds;
                const ty = pinchStart.cy - (pinchStart.cy - pinchStart.startTy) * ds;

                zState = { scale: newScale, tx: tx, ty: ty };
                applyZoom();

            } else if (touchState.mode === 'pan') {
                const dx = e.touches[0].clientX - touchState.sx;
                const dy = e.touches[0].clientY - touchState.sy;
                zState.tx = pinchStart.startTx + dx;
                zState.ty = pinchStart.startTy + dy;
                applyZoom();
            }
        }

        function handleEnd(e, scope) {
            if(touchState.mode === 'turn' && touchState.target) {
                isAnimating = true; // Lock
                const currentRot = getRot(touchState.target);
                touchState.target.style.transition = 'transform 0.4s cubic-bezier(0.1, 0.9, 0.2, 1)';
                
                let finish = false;
                if (touchState.dir === 1 && currentRot < -30) finish = true;
                else if (touchState.dir === -1 && currentRot > -150) finish = true;

                if (finish) {
                    if (touchState.dir === 1) {
                         touchState.target.style.transform = 'rotateY(-180deg)';
                         if(scope==='album') currPage++;
                         else clickMiniTurn(1, true);
                    } else {
                         touchState.target.style.transform = 'rotateY(0deg)';
                         if(scope==='album') currPage--;
                         else clickMiniTurn(-1, true);
                    }
                } else {
                    touchState.target.style.transform = (touchState.dir === 1) ? 'rotateY(0deg)' : 'rotateY(-180deg)';
                }

                setTimeout(() => {
                    touchState.target.style.transition = '';
                    if(scope==='album') updateStack(albumBook, albumSheets, currPage, false);
                    const s = touchState.target.querySelector('.face.front::after');
                    if(s) s.style.opacity = 0;
                    isAnimating = false; // Unlock
                    touchState.target = null;
                }, 400);
            }
            
            if ((touchState.mode === 'zoom' || touchState.mode === 'pan') && zState.scale < 1.1) {
                zState = {scale:1, tx:0, ty:0};
                const el = document.getElementById('activeZoom');
                if(el) {
                    el.style.transition = 'transform 0.3s ease';
                    applyZoom();
                    setTimeout(()=>el.style.transition='', 300);
                }
            }
            touchState.mode = null; 
        }

        function clickTurn(dir) {
            if(isAnimating) return; // Fix: Prevent clicks during animation
            
            // Boundary Checks
            if(dir === 1 && currPage >= albumSheets.length - 1) return;
            if(dir === -1 && currPage <= 0) return;

            const sheet = (dir===1) ? albumSheets[currPage] : albumSheets[currPage-1];
            if(!sheet) return;

            isAnimating = true; // Lock
            
            // Set starting point for backward animation logic
            if(dir===-1) {
                sheet.style.transform = 'rotateY(-180deg)';
            }
            
            sheet.style.zIndex = 2000;
            sheet.style.transition = 'transform 0.6s cubic-bezier(0.25,1,0.5,1)';
            
            // Force reflow to ensure transition plays
            sheet.offsetHeight; 
            
            sheet.style.transform = (dir===1) ? 'rotateY(-180deg)' : 'rotateY(0deg)';
            
            const s = sheet.querySelector('.face.front::after');
            if(s) { 
                s.style.opacity=0.5; 
                setTimeout(()=>s.style.opacity=0,600); 
            }

            setTimeout(() => {
                currPage += dir;
                sheet.style.transition='';
                updateStack(albumBook, albumSheets, currPage, false);
                isAnimating = false; // Unlock
            }, 600);
        }

        function clickMiniTurn(dir, skipAnim) {
             if(!skipAnim) {
                const next = currMiniPage + dir;
                if(next>=0 && next<ROWS*COLS) {
                    currMiniPage = next;
                    renderMiniFrame();
                    zState={scale:1,tx:0,ty:0};
                }
             } else {
                 const next = currMiniPage + dir;
                 if(next>=0 && next<ROWS*COLS) currMiniPage = next;
                 setTimeout(renderMiniFrame, 50); 
             }
        }

        function applyZoom() {
            const el = document.getElementById('activeZoom');
            if(el) el.style.transform = `translate(${zState.tx}px, ${zState.ty}px) scale(${zState.scale})`;
        }

        function calcLayout() {
            const w=window.innerWidth, h=window.innerHeight;
            const cpW = (1-(MARGIN_X*2)-(GAP*(COLS-1)))/COLS;
            const cpH = (1-(MARGIN_Y*2)-(GAP*(ROWS-1)))/ROWS;
            const asp = (REF_W*cpW)/(REF_H*cpH);
            let fw, fh;
            if(w/h > asp) { fh=h*0.85; fw=fh*asp; } else { fw=w*0.95; fh=fw/asp; }
            return { fw, fh, imgW: fw/cpW, imgH: fh/cpH };
        }
        function getPos(i, w, h) {
            const cpW = (1-(MARGIN_X*2)-(GAP*(COLS-1)))/COLS;
            const cpH = (1-(MARGIN_Y*2)-(GAP*(ROWS-1)))/ROWS;
            const c=i%COLS, r=Math.floor(i/COLS);
            return { x: -((MARGIN_X + c*cpW + c*GAP)*w), y: -((MARGIN_Y + r*cpH + r*GAP)*h) };
        }
        function getRot(el) {
            const m = el.style.transform.match(/rotateY\(([-\d.]+)deg\)/);
            return m ? parseFloat(m[1]) : 0;
        }

        init();
    </script>
